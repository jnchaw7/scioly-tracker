<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="scioly-portal-build" content="onboarding-v2">
  <title>SciOly Orders</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --ink: #111111;
      --ink-soft: #2c2c2c;
      --page: #f4f4f2;
      --surface: #ffffff;
      --surface-soft: #f7f7f6;
      --line: #e3e3df;
      --line-strong: #cacac4;
      --muted: #6d6d68;
      --muted-light: #94948e;
      --success: #237a4b;
      --success-bg: #eaf6ef;
      --warning: #9a5b13;
      --warning-bg: #fff4e5;
      --danger: #b42318;
      --danger-bg: #fef0ed;
      --info: #2c5d90;
      --info-bg: #edf4fb;
      --radius: 18px;
      --radius-small: 11px;
      --shadow: 0 1px 2px rgba(17,17,17,.04), 0 10px 30px rgba(17,17,17,.045);
      --sidebar: 232px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 3px solid rgba(17,17,17,.22);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }

    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 15% 8%, rgba(0,0,0,.055), transparent 26%),
        var(--page);
    }
    .login-card {
      width: min(100%, 430px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 38px;
      box-shadow: var(--shadow);
    }
    .brand-lockup { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand-name { font-size: 17px; font-weight: 750; letter-spacing: -.02em; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .login-card h1 {
      margin: 34px 0 10px;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.05;
      letter-spacing: -.045em;
    }
    .login-copy { margin: 0 0 26px; color: var(--muted); line-height: 1.65; }
    .google-wrap { min-height: 44px; }
    .error-banner {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid #facdc6;
      font-size: 13px;
      line-height: 1.45;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0,1fr);
    }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 18px 18px;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    .sidebar .brand-lockup { padding: 0 8px; }
    .sidebar .brand-mark { width: 36px; height: 36px; border-radius: 10px; }
    .nav-list { display: grid; gap: 5px; margin-top: 38px; }
    .nav-button {
      appearance: none;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-weight: 650;
      font-size: 14px;
    }
    .nav-button:hover { color: var(--ink); background: var(--surface-soft); }
    .nav-button.active { color: #fff; background: var(--ink); }
    .nav-icon { width: 19px; text-align: center; font-size: 16px; }
    .nav-count {
      min-width: 22px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      margin-left: auto;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 11px;
    }
    .nav-button.active .nav-count { color: var(--ink); background: #fff; }
    .sidebar-bottom { margin-top: auto; padding-top: 22px; }
    .user-block {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
    }
    .user-name { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .user-email {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .signout-link {
      width: 100%;
      margin-top: 10px;
      padding: 7px 0 0;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      font-weight: 650;
    }
    .signout-link:hover { color: var(--ink); }

    .main-content { min-width: 0; padding: 34px clamp(22px,4vw,56px) 60px; }
    .content-width { width: min(1120px,100%); margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 28px;
    }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .page-title {
      margin: 0;
      font-size: clamp(27px,4vw,40px);
      line-height: 1.08;
      letter-spacing: -.045em;
    }
    .page-subtitle { margin: 9px 0 0; color: var(--muted); line-height: 1.5; }
    .top-actions { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }

    .button {
      appearance: none;
      min-height: 41px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
    }
    .button:hover { border-color: var(--ink); transform: translateY(-1px); }
    .button-primary { border-color: var(--ink); background: var(--ink); color: #fff; }
    .button-primary:hover { background: var(--ink-soft); }
    .button-quiet { border-color: transparent; background: transparent; color: var(--muted); }
    .button-quiet:hover { color: var(--ink); background: var(--surface-soft); border-color: transparent; }
    .button-icon { width: 39px; padding: 0; }
    .button[disabled] { opacity: .55; cursor: wait; transform: none; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 13px;
      margin-bottom: 18px;
    }
    .summary-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 1px 1px rgba(17,17,17,.02);
    }
    .summary-label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .summary-value {
      margin-top: 9px;
      font-size: clamp(25px,3.5vw,34px);
      font-weight: 780;
      letter-spacing: -.045em;
      font-variant-numeric: tabular-nums;
    }
    .summary-context { margin-top: 5px; color: var(--muted-light); font-size: 11px; }

    .attention-card {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }
    .attention-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--ink);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
    }
    .attention-title { font-size: 13px; font-weight: 750; }
    .attention-copy { margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.45; }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 13px;
    }
    .section-title { margin: 0; font-size: 18px; letter-spacing: -.025em; }
    .section-caption { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .updated-at { color: var(--muted-light); font-size: 11px; white-space: nowrap; }
    .orders-list { display: grid; gap: 13px; }

    .order-card {
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(17,17,17,.018);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .order-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }
    .order-title { margin: 0; font-size: 17px; line-height: 1.3; letter-spacing: -.02em; }
    .order-meta { display: flex; flex-wrap: wrap; gap: 5px 11px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .order-meta span + span::before { content: "·"; margin-right: 11px; color: var(--line-strong); }
    .status-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink);
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }
    .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .72; }
    .status-delivered { color: var(--success); background: var(--success-bg); }
    .status-cancelled, .status-problem { color: var(--danger); background: var(--danger-bg); }
    .status-shipped { color: var(--info); background: var(--info-bg); }
    .status-ordered { color: #5c448b; background: #f2eef9; }
    .status-approval { color: var(--ink); background: #ececea; }

    .progress-wrap { margin-top: 20px; }
    .progress-track { height: 6px; overflow: hidden; border-radius: 999px; background: #e9e9e6; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--ink); transition: width .35s ease; }
    .progress-fill.delivered { background: var(--success); }
    .progress-labels { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 8px; }
    .progress-label { color: var(--muted-light); font-size: 10px; }
    .progress-label:nth-child(2), .progress-label:nth-child(3) { text-align: center; }
    .progress-label:last-child { text-align: right; }
    .progress-label.reached { color: var(--ink); font-weight: 700; }

    .estimate-box {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 17px;
      padding: 13px 14px;
      border-left: 3px solid var(--ink);
      border-radius: 2px 10px 10px 2px;
      background: var(--surface-soft);
    }
    .estimate-box.delivered { border-left-color: var(--success); background: var(--success-bg); }
    .estimate-box.problem { border-left-color: var(--danger); background: var(--danger-bg); }
    .estimate-text { font-size: 13px; font-weight: 720; line-height: 1.4; }
    .estimate-subtext { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .confidence {
      flex: 0 0 auto;
      align-self: flex-start;
      padding: 5px 7px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--muted);
      background: var(--surface);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .order-actions { display: flex; align-items: center; gap: 8px; margin-top: 15px; }
    .details-button { margin-left: -10px; }
    .chevron { display: inline-block; transition: transform .16s ease; }
    .details-button[aria-expanded="true"] .chevron { transform: rotate(180deg); }
    .details-panel {
      display: none;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 12px 24px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
    }
    .details-panel.open { display: grid; }
    .detail-label { color: var(--muted); font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: .055em; }
    .detail-value { margin-top: 4px; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
    .detail-wide { grid-column: 1/-1; }

    .history-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .search-wrap { position: relative; flex: 1; max-width: 380px; }
    .search-input {
      width: 100%;
      height: 41px;
      padding: 9px 13px 9px 36px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }
    .search-input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(17,17,17,.08); }
    .search-icon { position: absolute; top: 50%; left: 13px; transform: translateY(-50%); color: var(--muted-light); font-size: 13px; }
    .filter-group { display: flex; gap: 5px; padding: 4px; border-radius: 10px; background: #e9e9e6; }
    .filter-button {
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .filter-button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(17,17,17,.08); }

    .empty-state {
      padding: 52px 24px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255,255,255,.44);
      text-align: center;
    }
    .empty-icon { width: 44px; height: 44px; display: grid; place-items: center; margin: 0 auto 15px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line); }
    .empty-state h3 { margin: 0; font-size: 16px; }
    .empty-state p { max-width: 430px; margin: 7px auto 0; color: var(--muted); font-size: 13px; line-height: 1.55; }

    .loading-state { padding: 80px 0; text-align: center; color: var(--muted); }
    .spinner {
      width: 26px;
      height: 26px;
      margin: 0 auto 13px;
      border: 3px solid var(--line);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 30;
      max-width: min(360px,calc(100vw - 44px));
      padding: 12px 15px;
      border-radius: 11px;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 12px 35px rgba(0,0,0,.2);
      font-size: 12px;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .stats-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-bottom: 22px; }
    .stats-section {
      margin-top: 16px;
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .stats-section-title { margin: 0 0 14px; font-size: 15px; letter-spacing: -.02em; }
    .compact-list { display: grid; gap: 8px; }
    .list-button, .list-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-soft);
      color: var(--ink);
      text-align: left;
    }
    .list-button { cursor: pointer; }
    .list-button:hover { border-color: var(--ink); }
    .list-title { font-size: 13px; font-weight: 720; }
    .list-meta { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .list-value { flex: 0 0 auto; font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .list-arrow { margin-left: 8px; color: var(--muted-light); }
    .high-value .list-row { background: var(--warning-bg); border-color: #f0d8b4; }
    .detail-header { display: flex; align-items: center; gap: 13px; margin-bottom: 20px; }
    .detail-heading h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .detail-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .person-group { padding: 15px 0; border-top: 1px solid var(--line); }
    .person-group:first-child { border-top: 0; padding-top: 0; }
    .person-group:last-child { padding-bottom: 0; }
    .person-group-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 9px; }
    .mini-items { display: grid; gap: 6px; }
    .mini-item { display: flex; justify-content: space-between; gap: 16px; padding: 10px 12px; border-radius: 9px; background: var(--surface-soft); font-size: 12px; }
    .mini-item span:last-child { flex: 0 0 auto; font-weight: 700; }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 16px;
        padding: 14px 18px 10px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .sidebar .brand-name, .sidebar .brand-caption { display: none; }
      .nav-list { display: flex; align-items: center; gap: 5px; margin: 0; overflow-x: auto; }
      .nav-button { width: auto; white-space: nowrap; }
      .nav-icon { display: none; }
      .sidebar-bottom { display: none; }
      .main-content { padding-top: 28px; }
    }
    @media (max-width: 720px) {
      .summary-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .summary-card:last-child { grid-column: 1/-1; }
      .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .topbar { flex-direction: column; }
      .top-actions { width: 100%; }
      .top-actions .button-primary { flex: 1; }
      .history-toolbar { align-items: stretch; flex-direction: column; }
      .search-wrap { max-width: none; }
      .filter-group { align-self: flex-start; }
    }
    @media (max-width: 520px) {
      .login-page { padding: 14px; }
      .login-card { padding: 27px 22px; }
      .sidebar { padding-inline: 12px; }
      .main-content { padding: 23px 14px 42px; }
      .page-title { font-size: 30px; }
      .summary-card { padding: 17px; }
      .order-card { padding: 17px; }
      .order-top { flex-direction: column; gap: 11px; }
      .order-meta span + span::before { display: none; }
      .estimate-box { flex-direction: column; gap: 9px; }
      .confidence { align-self: flex-start; }
      .progress-label:nth-child(2) { text-align: left; }
      .progress-label:nth-child(3) { text-align: right; }
      .progress-label:nth-child(2), .progress-label:nth-child(3) { font-size: 0; }
      .details-panel { grid-template-columns: 1fr; }
      .detail-wide { grid-column: auto; }
      .button-label-mobile { display: none; }
      .attention-card { align-items: flex-start; }
      .stats-section { padding: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation-duration: .001ms !important; }
    }
  </style>
  <style>
    /* Preview-derived black + blue interface */
    :root {
      --ink: #f7f9fc;
      --ink-soft: #dce5f3;
      --page: #070b12;
      --surface: #0d1420;
      --surface-soft: #111c2b;
      --line: #1d2a3c;
      --line-strong: #2c3d55;
      --muted: #91a0b5;
      --muted-light: #6f8098;
      --blue: #4f8cff;
      --blue-bright: #6ea2ff;
      --blue-soft: rgba(79,140,255,.12);
      --success: #4ade9b;
      --success-bg: rgba(45,201,128,.11);
      --warning: #f8b86b;
      --warning-bg: rgba(248,184,107,.10);
      --danger: #ff7b8c;
      --danger-bg: rgba(255,83,112,.10);
      --info: #73a8ff;
      --info-bg: rgba(79,140,255,.11);
      --shadow: 0 18px 55px rgba(0,0,0,.24);
    }

    body {
      background:
        radial-gradient(circle at 18% -5%, rgba(44,103,202,.18), transparent 29%),
        radial-gradient(circle at 88% 4%, rgba(34,79,154,.10), transparent 22%),
        var(--page);
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline-color: rgba(110,162,255,.72);
    }

    .login-page {
      background:
        radial-gradient(circle at 22% 14%, rgba(79,140,255,.19), transparent 27%),
        radial-gradient(circle at 82% 86%, rgba(44,103,202,.11), transparent 28%),
        var(--page);
    }

    .login-card {
      background: rgba(13,20,32,.92);
      border-color: var(--line);
      box-shadow: 0 30px 80px rgba(0,0,0,.38);
      backdrop-filter: blur(18px);
    }

    .brand-mark {
      background: linear-gradient(145deg, var(--blue-bright), #316ee3);

  <script>

    let googleCredential = null;
    let currentDashboardData = null;
    let currentIsExecutive = false;
    let currentIsSuperAdmin = false;
    let currentMaintenanceMode = false;
    let currentUserProfile = null;
    let savedTeamStatistics = null;
    let currentPage = "orders";

    let historySearch = "";

    let lastUpdatedAt = null;
    let toastTimer = null;
    let onboardingStep = 0;
    let onboardingName = "";
    const previewParameters = new URLSearchParams(window.location.search);
    const previewRequest = previewParameters.get("preview");
    const publicOnboardingDemo = previewParameters.get("demo") === "onboarding";
    const previewHostAllowed =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1" ||
      window.location.protocol === "file:";
    let localPreviewMode =
      publicOnboardingDemo
        ? "student"
        : previewHostAllowed && (previewRequest === "student" || previewRequest === "exec" || previewRequest === "admin")
          ? previewRequest
          : null;
    const previewFirstTime =
      publicOnboardingDemo ||
      (previewHostAllowed && previewParameters.get("firstTime") === "1");

    window.addEventListener("DOMContentLoaded", function() {
      if (localPreviewMode) startLocalPreview(localPreviewMode);
    });

    function handleCredentialResponse(response) {
      if (localPreviewMode) return;
      hideLoginError();
      googleCredential = response.credential;
      loadDashboard();
    }

    function startLocalPreview(mode) {
      currentIsExecutive = mode === "exec" || mode === "admin";
      currentIsSuperAdmin = mode === "admin";
      currentMaintenanceMode = false;
      currentDashboardData = buildPreviewDashboard(currentIsExecutive);
      if (currentIsSuperAdmin) currentDashboardData.email = "jn.chaw7@gmail.com";
      currentUserProfile = previewFirstTime
        ? { name: "", needsName: true, onboardingComplete: false, needsOnboarding: true }
        : {
            name: currentIsExecutive ? "Preview Executive" : "Preview Student",
            needsName: false,
            onboardingComplete: true,
            needsOnboarding: false
          };
      savedTeamStatistics = currentIsExecutive ? buildPreviewTeamStatistics() : null;
      lastUpdatedAt = new Date();
      initializeApp();
      navigateTo(currentIsSuperAdmin ? "admin" : (currentIsExecutive ? "team" : "orders"));
      if (currentUserProfile.needsOnboarding || currentUserProfile.needsName) showOnboarding();
      window.setTimeout(function() {
        showToast(publicOnboardingDemo ? "Orientation demo · mock data" : (currentIsSuperAdmin ? "Local owner preview" : (currentIsExecutive ? "Local executive preview" : "Local student preview")));
      }, 120);
    }

    function buildPreviewDashboard(isExecutive) {

          {

            numericPrice: 27.75,

            signatures: "Completed",
            orderStatus: "Delivered",
            stage: "DELIVERED",
            step: 7,
            isDelivered: true,

            estimateConfidenceDetail: "Delivery is confirmed by the current order status.",

    function buildPreviewTeamStatistics() {
      const julianItems = [
        { itemName: "Pololu gearmotors", eventName: "Electric Vehicle", quantity: 2, price: 52.98, status: "Pending" },
        { itemName: "BNO085 IMU", eventName: "Electric Vehicle", quantity: 1, price: 31.75, status: "Ordered" }
      ];
      const juliaItems = [
        { itemName: "Diffraction grating", eventName: "Astronomy", quantity: 2, price: 18.00, status: "Delivered" }
      ];
      const ericItems = [
        { itemName: "Heat lamp stand", eventName: "Thermodynamics", quantity: 2, price: 39.96, status: "Ordered" }
      ];

      return {
        totalOrders: 18,
        totalStudents: 6,
        totalQuantity: 27,
        totalCost: 1284.73,
        portalAccess: {
          totalLogins: 14,
          uniqueVisitors: 5,
          recentLogins: [
            { email: "100034572@mvla.net", timestamp: new Date(Date.now() - 8 * 60000).toISOString() },
            { email: "100032279@mvla.net", timestamp: new Date(Date.now() - 52 * 60000).toISOString() },
            { email: "preview.student@mvla.net", timestamp: new Date(Date.now() - 26 * 3600000).toISOString() }
          ],
          neverLoggedIn: [
            { name: "Avery Student", email: "100039999@mvla.net" },
            { name: "Jordan Student", email: "100038888@mvla.net" }
          ]
        },
        highValueOrders: [
          { name: "Arjun Patel", itemName: "Build clinic registration", eventName: "Team", quantity: 1, status: "Approved", price: 975.00 },
          { name: "Julian Chaw", itemName: "Pololu gearmotors", eventName: "Electric Vehicle", quantity: 2, status: "Pending", price: 52.98 }
        ],
        events: [
          {

            ]
          },
          {

            orderCount: 4,
            totalCost: 112.35,

          },
          {
            eventName: "Thermodynamics",
            orderCount: 3,
            totalCost: 94.62,
            people: [{ name: "Eric Shiu", totalCost: 39.96, items: ericItems }]
          }
        ],
        people: [
          { name: "Julian Chaw", orderCount: 2, totalCost: 84.73, items: julianItems },
          { name: "Julia Lee", orderCount: 1, totalCost: 18.00, items: juliaItems },
          { name: "Eric Shiu", orderCount: 1, totalCost: 39.96, items: ericItems },
          { name: "Maya Chen", orderCount: 3, totalCost: 161.67, items: [{ itemName: "Wheel set", eventName: "Electric Vehicle", quantity: 3, price: 161.67, status: "Approved" }] }
        ]
      };
    }

    function apiRequest(payload) {
      if (!googleCredential) {
        return Promise.reject(new Error("Your Google login session is missing. Please sign in again."));
      }
      return fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ token: googleCredential, ...payload })
      }).then(function(response) {
        if (!response.ok) throw new Error("The portal could not reach the order database.");
        return response.json();
      });
    }

    function loadDashboard() {
      apiRequest({ action: "login" })
        .then(function(result) {
          if (result.type !== "student" && result.type !== "exec") {
            throw new Error(result.message || "Login failed.");
          }
          currentDashboardData = result.data || { items: [], totalCost: 0 };
          if (result.email && !currentDashboardData.email) currentDashboardData.email = result.email;
          currentIsExecutive = result.type === "exec";
          currentIsSuperAdmin = result.isSuperAdmin === true;
          currentMaintenanceMode = result.maintenanceMode === true;
          currentUserProfile = result.profile || { name: "", needsName: false, onboardingComplete: true, needsOnboarding: false };
          lastUpdatedAt = new Date();
          initializeApp();
          navigateTo("orders");
          if (currentUserProfile.needsOnboarding || currentUserProfile.needsName) showOnboarding();
        })
        .catch(function(error) {
          document.getElementById("app-shell").hidden = true;
          document.getElementById("login-page").hidden = false;
          showLoginError(error);
        });
    }

    function initializeApp() {
      const items = getItems();
      const displayName = getDisplayName();
      document.getElementById("login-page").hidden = true;
      document.getElementById("app-shell").hidden = false;
      document.getElementById("sidebar-user-name").textContent = displayName;
      document.getElementById("sidebar-user-email").textContent = currentDashboardData.email || "";
      document.getElementById("active-nav-count").textContent = items.filter(isActiveItem).length;
      document.getElementById("history-nav-count").textContent = items.filter(isHistoryItem).length;
      document.getElementById("nav-team").hidden = !currentIsExecutive;
      document.getElementById("nav-admin").hidden = !currentIsSuperAdmin;
    }

    function navigateTo(page) {
      if (page === "team" && !currentIsExecutive) return;
      if (page === "admin" && !currentIsSuperAdmin) return;
      currentPage = page;
      ["orders", "history", "team", "admin"].forEach(function(name) {
        const button = document.getElementById("nav-" + name);
        if (button) {
          button.classList.toggle("active", name === page);
          button.setAttribute("aria-current", name === page ? "page" : "false");
        }
      });

      if (page === "history") renderHistoryPage();
      else if (page === "team") showTeamStatistics();
      else if (page === "admin") renderAdminPage();
      else renderOrdersPage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderOrdersPage() {
      const items = getItems();
      const activeItems = items.filter(isActiveItem);
      const deliveredCount = items.filter(isDeliveredItem).length;
      const totalCost = Number(currentDashboardData.totalCost || items.reduce(function(sum,item) {
        return sum + Number(item.numericPrice || 0);
      }, 0));
      const firstName = getFirstName();
      const pendingApprovals = activeItems.filter(function(item) {
        return getStage(item) === "PENDING" && Number(item.step || 0) < 7;
      }).length;
      document.getElementById("page-content").innerHTML = `
        ${pageHeader(
          `Hi, ${escapeHTML(firstName)}.`,
          "Here’s what’s happening with your Science Olympiad orders.",
          true
        )}

        <section class="summary-grid" aria-label="Your order summary">
          ${summaryCard("In progress", activeItems.length, pendingApprovals === 1 ? "1 is collecting approvals" : `${pendingApprovals} are collecting approvals`)}
          ${summaryCard("Total requested", "$" + money(totalCost), "Price × quantity across your orders")}
          ${summaryCard("Delivered", deliveredCount, deliveredCount === 1 ? "1 completed order" : `${deliveredCount} completed orders`)}
        </section>

        <section aria-labelledby="active-orders-heading">
          <div class="section-head">
            <div>
              <h2 class="section-title" id="active-orders-heading">Active orders</h2>
              <p class="section-caption">Approval progress and the best currently available arrival estimate.</p>
            </div>
            <span class="updated-at">${formatUpdatedTime()}</span>
          </div>
          <div class="orders-list">
            ${activeItems.length ? activeItems.map(renderOrderCard).join("") : emptyState(
              "✓", "No active orders", "You’re all caught up. Delivered and cancelled orders remain available in History.", true
            )}
          </div>
        </section>
      `;
    }

    function renderHistoryPage() {
      const allHistory = getItems().filter(isHistoryItem);
      const filtered = allHistory.filter(function(item) {
        if (historyFilter === "delivered" && !isDeliveredItem(item)) return false;
        if (historyFilter === "cancelled" && getStage(item) !== "CANCELLED") return false;
        if (!historySearch) return true;
        const haystack = [item.itemName, item.eventName, item.orderStatus, item.vendor].join(" ").toLowerCase();
        return haystack.includes(historySearch.toLowerCase());
      });

      document.getElementById("page-content").innerHTML = `
        ${pageHeader("Order history", "Delivered and cancelled orders linked to your account.", false)}
        <div class="history-toolbar">
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Search order history</span>
            <input class="search-input" id="history-search" type="search" placeholder="Search items or events" value="${escapeAttribute(historySearch)}" oninput="updateHistorySearch(this.value)">
          </label>
          <div class="filter-group" aria-label="History filter">
            ${historyFilterButton("all", "All")}
            ${historyFilterButton("delivered", "Delivered")}
            ${historyFilterButton("cancelled", "Cancelled")}
          </div>
        </div>
        <div class="section-head">
          <div>
            <h2 class="section-title">${filtered.length} ${filtered.length === 1 ? "order" : "orders"}</h2>
            <p class="section-caption">History uses current final statuses; dates are not shown because they are not in the portal data yet.</p>
          </div>
        </div>
        <div class="orders-list">
          ${filtered.length ? filtered.map(renderOrderCard).join("") : emptyState(
            "↺", allHistory.length ? "No matching orders" : "No order history yet",
            allHistory.length ? "Try another search or filter." : "Orders will appear here after they are delivered or cancelled.", false
          )}
        </div>
      `;
      const input = document.getElementById("history-search");
      if (input && historySearch) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function renderOrderCard(item) {
      const stage = getStage(item);
      const status = getFriendlyStatus(item);
      const progress = getProgress(item);
      const confidence = getConfidence(item);
      const qty = Number(item.numericQuantity || item.qty || 1);
      const unitPrice = Number(item.unitPrice);
      const showUnitPrice = Number.isFinite(unitPrice) && qty > 1;
      const id = "details-" + String(item.rowNum || Math.random()).replace(/[^a-zA-Z0-9_-]/g, "");
      const validLink = safeHttpUrl(item.link);
      const estimateTone = isDeliveredItem(item) ? "delivered" : (item.isStuck || stage === "CANCELLED" ? "problem" : "");
      const estimateText = item.deliveryText || fallbackDeliveryText(item);

      return `
        <article class="order-card">
          <div class="order-top">
            <div>
              <h3 class="order-title">${escapeHTML(item.itemName || "Unnamed item")}</h3>
              <div class="order-meta">
                <span>${escapeHTML(item.eventName || "Unassigned event")}</span>
                <span>Qty ${escapeHTML(item.qty || qty)}</span>
                <span>${escapeHTML(item.price || "$" + money(item.numericPrice))} total</span>
              </div>
            </div>
            <span class="status-pill ${status.className}">${escapeHTML(status.label)}</span>
          </div>

          ${stage === "CANCELLED" ? "" : `
            <div class="progress-wrap" aria-label="Order progress: ${escapeAttribute(status.label)}">
              <div class="progress-track"><div class="progress-fill ${isDeliveredItem(item) ? "delivered" : ""}" style="width:${progress.percent}%"></div></div>
              <div class="progress-labels">
                ${["Submitted","Approved","Ordered","Delivered"].map(function(label,index) {
                  return `<span class="progress-label ${index <= progress.reached ? "reached" : ""}">${label}</span>`;
                }).join("")}
              </div>
            </div>
          `}

          <div class="estimate-box ${estimateTone}">
            <div>
              <div class="estimate-text">${escapeHTML(estimateText)}</div>
              <div class="estimate-subtext">${escapeHTML(confidence.detail)}</div>
            </div>
            <span class="confidence">${escapeHTML(confidence.label)}</span>
          </div>

          <div class="order-actions">
            <button class="button button-quiet details-button" type="button" aria-expanded="false" aria-controls="${id}" onclick="toggleDetails(this)">
              Order details <span class="chevron" aria-hidden="true">⌄</span>
            </button>
            ${validLink ? `<a class="button button-quiet" href="${escapeAttribute(validLink)}" target="_blank" rel="noopener noreferrer">View item ↗</a>` : ""}
          </div>

          <div class="details-panel" id="${id}">
            <div>
              <div class="detail-label">Approval record</div>
              <div class="detail-value">${escapeHTML(item.signatures || "Pending")}</div>
            </div>
            <div>
              <div class="detail-label">Current order status</div>
              <div class="detail-value">${escapeHTML(item.orderStatus || "Pending")}</div>
            </div>
            ${showUnitPrice ? `
              <div>
                <div class="detail-label">Price calculation</div>
                <div class="detail-value">$${money(unitPrice)} each × ${qty} = ${escapeHTML(item.price)}</div>
              </div>
            ` : ""}
            <div>
              <div class="detail-label">Vendor type</div>
              <div class="detail-value">${escapeHTML(formatVendor(item.vendor))}</div>
            </div>
            <div class="detail-wide">
              <div class="detail-label">Estimate explanation</div>
              <div class="detail-value">${escapeHTML(confidence.fullDetail)}</div>
            </div>
          </div>
        </article>
      `;
    }

    function pageHeader(title, subtitle, showOrderButton) {
      return `
        <header class="topbar">
          <div>
            <div class="eyebrow">${currentIsExecutive ? "Executive account" : "Personal dashboard"}</div>
            <h1 class="page-title">${escapeHTML(title)}</h1>
            <p class="page-subtitle">${escapeHTML(subtitle)}</p>
          </div>
          <div class="top-actions">
            <button class="button button-icon" id="refresh-button" type="button" onclick="refreshDashboard()" aria-label="Refresh order data" title="Refresh">↻</button>
            ${showOrderButton ? `<button class="button button-primary" type="button" onclick="openOrderingForm()"><span aria-hidden="true">＋</span> Place new order</button>` : ""}
          </div>
        </header>
      `;
    }

    function summaryCard(label, value, context) {
      return `<div class="summary-card"><div class="summary-label">${escapeHTML(label)}</div><div class="summary-value">${escapeHTML(value)}</div><div class="summary-context">${escapeHTML(context)}</div></div>`;
    }

    function getAttentionMessage(activeItems, pendingApprovals, stuckCount) {
      if (stuckCount > 0) return { icon: "!", title: `${stuckCount} ${stuckCount === 1 ? "order needs" : "orders need"} attention`, copy: "Approval progress appears slower than expected. The estimate on the affected order explains why." };
      if (pendingApprovals > 0) return { icon: "→", title: `${pendingApprovals} ${pendingApprovals === 1 ? "order is" : "orders are"} moving through approvals`, copy: "No action is required from you right now. The portal will update as signatures are completed." };
      if (activeItems.length > 0) return { icon: "✓", title: "Your active orders have cleared approvals", copy: "They are now awaiting purchase, shipment, or delivery confirmation." };
      return { icon: "✓", title: "Everything is up to date", copy: "You do not currently have any orders in progress." };
    }

    function getItems() {
      return currentDashboardData && Array.isArray(currentDashboardData.items) ? currentDashboardData.items : [];
    }

    function getStage(item) {
      const explicit = String(item.stage || "").trim().toUpperCase();
      if (explicit) return explicit;
      const status = String(item.orderStatus || "").toLowerCase();
      if (status.includes("deliver")) return "DELIVERED";
      if (status.includes("cancel")) return "CANCELLED";
      if (status.includes("ship") || status.includes("transit")) return "SHIPPED";
      if (status.includes("order") || status.includes("purchas")) return "ORDERED";
      return "PENDING";
    }

    function isDeliveredItem(item) {
      return Boolean(item.isDelivered) || getStage(item) === "DELIVERED";
    }

    function isHistoryItem(item) {
      const stage = getStage(item);
      return isDeliveredItem(item) || stage === "CANCELLED";
    }

    function isActiveItem(item) { return !isHistoryItem(item); }

    function getFriendlyStatus(item) {
      const stage = getStage(item);
      const step = Math.max(0, Math.min(7, Number(item.step || 0)));
      if (stage === "DELIVERED") return { label: "Delivered", className: "status-delivered" };
      if (stage === "CANCELLED") return { label: "Cancelled", className: "status-cancelled" };
      if (stage === "SHIPPED") return { label: "Shipped", className: "status-shipped" };
      if (stage === "ORDERED") return { label: "Ordered", className: "status-ordered" };
      if (step >= 7 || /complete/i.test(String(item.signatures || ""))) return { label: "Approved · Awaiting order", className: "status-approval" };
      if (step > 0) return { label: `Approvals ${step} of 7`, className: "status-approval" };
      return { label: "Preparing paperwork", className: "status-approval" };
    }

    function getProgress(item) {
      const stage = getStage(item);
      const step = Math.max(0, Math.min(7, Number(item.step || 0)));
      if (stage === "DELIVERED") return { percent: 100, reached: 3 };
      if (stage === "SHIPPED") return { percent: 86, reached: 2 };
      if (stage === "ORDERED") return { percent: 71, reached: 2 };
      if (step >= 7 || /complete/i.test(String(item.signatures || ""))) return { percent: 50, reached: 1 };
      return { percent: Math.max(8, 8 + (step / 7) * 39), reached: 0 };
    }

    function getConfidence(item) {
      const stage = getStage(item);
      const actual = isDeliveredItem(item) || stage === "CANCELLED" || String(item.estimateConfidence || "").toLowerCase() === "actual";
      if (actual) {
        return {
          label: "Confirmed",
          detail: stage === "CANCELLED" ? "This is a confirmed final status." : "Delivery is confirmed by the current order status.",
          fullDetail: item.estimateConfidenceDetail || (stage === "CANCELLED" ? "Cancellation is confirmed by the current order status." : "Delivery is confirmed by the current order status.")
        };
      }
      const level = String(item.estimateConfidenceLabel || item.estimateConfidence || "Low");
      const detail = item.estimateConfidenceDetail || fallbackConfidenceDetail(item);
      return {
        label: `${capitalize(level)} confidence`,
        detail: "Estimated timing — not carrier tracking.",
        fullDetail: detail
      };
    }

    function fallbackConfidenceDetail(item) {
      const stage = getStage(item);
      const confidence = String(item.estimateConfidence || "low").toLowerCase();
      if (confidence === "high") return "Based on a stronger amount of historical timing data.";
      if (confidence === "medium") return "Based on a limited but useful amount of historical timing data.";
      if (stage === "ORDERED" && String(item.vendor || "").toUpperCase() === "AMAZON") return "The estimate may still rely on the default Amazon delivery timing while more history is collected.";
      if (stage === "ORDERED" || stage === "SHIPPED") return "More completed delivery history is needed before this estimate becomes stronger.";
      return "The estimator is still learning from approval history.";
    }

    function fallbackDeliveryText(item) {
      const stage = getStage(item);
      if (stage === "DELIVERED") return "Delivered";
      if (stage === "CANCELLED") return "Order cancelled";
      if (stage === "SHIPPED") return "In transit — arrival estimate unavailable";
      if (stage === "ORDERED") return "Ordered — arrival estimate unavailable";
      if (Number(item.step || 0) >= 7) return "Approved — awaiting purchase";
      return "Approval timing is being estimated";
    }

    function formatVendor(vendor) {
      const value = String(vendor || "").toUpperCase();
      if (value === "AMAZON") return "Amazon";
      if (value === "OTHER") return "Other vendor";
      return "Not identified";
    }

            ${summaryCard("Unique visitors", Number(portalAccess.uniqueVisitors || 0), "Verified Google accounts")}
            ${summaryCard("Never logged in", neverLoggedIn.length, "Accounts found in Master")}
          </div>
          <div class="activity-columns">

    function formatAccessTime(value) {
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return "Unknown time";
      return date.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

    function updateTeamEventSearch(value) {
      teamEventSearch = String(value || "");
      const target = document.getElementById("event-results");
      if (target) target.innerHTML = renderEventSearchResults(window.statisticsEvents || [], teamEventSearch);

    function updateTeamPeopleSearch(value) {
      teamPeopleSearch = String(value || "");
      const target = document.getElementById("people-results");
      if (target) target.innerHTML = renderPeopleSearchResults(window.statisticsPeople || [], teamPeopleSearch);
    }

    function renderEventSearchResults(events, query) {
      const normalized = String(query || "").trim().toLowerCase();
      const matches = events
        .map(function(event, index) { return { event: event, index: index }; })
        .filter(function(entry) {
          return !normalized || String(entry.event.eventName || "").toLowerCase().includes(normalized);
        });

      if (!matches.length) {
        return `<div class="no-results">${events.length ? "No events match your search." : "No event data is currently available."}</div>`;
      }

      return matches.map(function(entry) {
        const event = entry.event;
        return `<button class="list-button" type="button" onclick="showEventDetails(${entry.index})"><div><div class="list-title">${escapeHTML(event.eventName || "Unassigned event")}</div><div class="list-meta">${Number(event.orderCount || 0)} ${Number(event.orderCount || 0) === 1 ? "order" : "orders"}</div></div><div class="list-value">$${money(event.totalCost)} <span class="list-arrow">→</span></div></button>`;
      }).join("");
    }

    function renderPeopleSearchResults(people, query) {
      const normalized = String(query || "").trim().toLowerCase();
      const matches = people
        .map(function(person, index) { return { person: person, index: index }; })
        .filter(function(entry) {
          return !normalized || String(entry.person.name || "").toLowerCase().includes(normalized);
        });

      if (!matches.length) {
        return `<div class="no-results">${people.length ? "No people match your search." : "No people found."}</div>`;
      }

      return matches.map(function(entry) {
        const person = entry.person;
        return `<button class="list-button" type="button" onclick="showPersonDetails(${entry.index})"><div><div class="list-title">${escapeHTML(person.name || "Unknown")}</div><div class="list-meta">${Number(person.orderCount || 0)} ${Number(person.orderCount || 0) === 1 ? "order" : "orders"}</div></div><div class="list-value">$${money(person.totalCost)} <span class="list-arrow">→</span></div></button>`;
      }).join("");
    }

    function showPersonDetails(index) {

          <h3 class="stats-section-title">Ordered items</h3>
          <div class="compact-list">

    function toggleMaintenanceMode() {
      if (!currentIsSuperAdmin) return;
      const enable = !currentMaintenanceMode;
      const confirmed = window.confirm(
        enable
          ? "Turn on maintenance mode? Everyone except the two owner accounts will be blocked immediately."
          : "Turn the portal back on for students and executives?"
      );
      if (!confirmed) return;
      runAdminAction(
        { action: "setMaintenanceMode", enabled: enable },
        enable ? "Maintenance mode is on." : "The portal is back online."
      );

    function resetOnboarding() {
      if (!currentIsSuperAdmin || !currentMaintenanceMode) return;
      const confirmation = window.prompt('Type RESET ONBOARDING to make the orientation new for everyone again.');
      if (confirmation !== "RESET ONBOARDING") {
        if (confirmation !== null) showToast('Reset cancelled: type "RESET ONBOARDING" exactly.');
        return;
      }
      runAdminAction(
        { action: "resetUserProfiles", confirmation: confirmation },
        "Names and onboarding were reset. Login and estimator history were preserved."
      );

    function runAdminAction(payload, successMessage) {
      if (!currentIsSuperAdmin) return;
      setAdminControlsDisabled(true);

      if (localPreviewMode) {
        if (payload.action === "setMaintenanceMode") currentMaintenanceMode = payload.enabled === true;
        window.setTimeout(function() {
          renderAdminPage();
          showToast(successMessage);
        }, 180);
        return;
      }

      apiRequest(payload)
        .then(function(result) {
          if (result.type !== "adminAction") throw new Error(result.message || "The admin action failed.");
          currentMaintenanceMode = result.maintenanceMode === true;
          currentIsSuperAdmin = result.isSuperAdmin === true;
          renderAdminPage();
          showToast(successMessage);
        })
        .catch(function(error) {
          renderAdminPage();
          showToast(error.message || "The admin action failed.");
        });
    }

      ["maintenance-admin-button", "reset-onboarding-button"].forEach(function(id) {

        if (button) button.disabled = disabled;
      });

    function getDisplayName() {
      if (currentUserProfile && currentUserProfile.name) return currentUserProfile.name;

      if (item) return item.personName;
      const email = String(currentDashboardData && currentDashboardData.email || "");
      return email ? email.split("@")[0] : (currentIsExecutive ? "Executive" : "Student");

      const modal = document.getElementById("onboarding-modal");

      renderOnboardingStep();

    function renderOnboardingStep() {
      const content = document.getElementById("onboarding-content");
      const label = document.getElementById("onboarding-step-label");
      const progress = document.getElementById("onboarding-progress");
      const back = document.getElementById("onboarding-back");
      const next = document.getElementById("onboarding-next");
      const error = document.getElementById("onboarding-error");
      if (!content || !next) return;

      if (label) label.textContent = `Step ${onboardingStep + 1} of 4`;
      if (error) error.textContent = "";
      if (back) back.hidden = onboardingStep === 0;
      next.disabled = false;

      if (onboardingStep === 0) {
        content.innerHTML = `
          <h2 id="onboarding-title">What should we call you?</h2>
          <p class="onboarding-lead">Enter the name you want shown in the portal. It will be connected to your verified Google account.</p>
          <label class="name-label" for="profile-name-input">Your name</label>
          <input class="name-input" id="profile-name-input" name="displayName" type="text" autocomplete="name" maxlength="60" placeholder="Julian" value="${escapeAttribute(onboardingName)}" required>
          <div class="name-email">${escapeHTML(currentDashboardData && currentDashboardData.email || "Verified Google account")}</div>
        `;
        next.textContent = "Save and continue";
      } else if (onboardingStep === 1) {
        content.innerHTML = `
          <h2 id="onboarding-title">Welcome, ${escapeHTML(getFirstName())}.</h2>
          <p class="onboarding-lead">The portal keeps your Science Olympiad purchases organized without making you search through spreadsheets.</p>
          <div class="onboarding-feature-list">
            ${onboardingFeature("01", "Orders is your home page", "See active requests, approval progress, quantities, costs, and the best available arrival estimate.")}
            ${onboardingFeature("02", "Open any order", "Use Order details to see the approval record, vendor type, and why an estimate has its current confidence level.")}
          </div>
        `;
        next.textContent = "Next";
      } else if (onboardingStep === 2) {
        content.innerHTML = `
          <h2 id="onboarding-title">Everything stays easy to find.</h2>
          <p class="onboarding-lead">The tabs in the left sidebar separate current work from completed records.</p>
          <div class="onboarding-feature-list">
            ${onboardingFeature("↺", "History", "Delivered and cancelled orders move to History, where you can search by item or event.")}
            ${onboardingFeature("↻", "Refresh", "Use the refresh button whenever you want the newest information from the treasury spreadsheet.")}
            ${currentIsExecutive ? onboardingFeature("◎", "Team insights", "Executive accounts can search team spending by event or person and review portal activity.") : ""}
          </div>
        `;
        next.textContent = "Next";
      } else {
        content.innerHTML = `
          <h2 id="onboarding-title">You’re ready to go.</h2>
          <p class="onboarding-lead">You will not see this orientation again unless an owner intentionally resets onboarding.</p>
          <div class="onboarding-ready">Use <strong>Place new order</strong> when you need to submit another purchase request. Your dashboard will update after treasury data is processed.</div>
        `;
        next.textContent = "Enter portal";
      }

      if (progress) {
        progress.innerHTML = [0,1,2,3].map(function(index) {
          return `<span class="onboarding-progress-dot ${index <= onboardingStep ? "active" : ""}"></span>`;
        }).join("");
      }

      if (onboardingStep === 0) {
        window.setTimeout(function() {
          const input = document.getElementById("profile-name-input");
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        }, 0);
      }
    }

    function onboardingFeature(icon, title, copy) {
      return `<div class="onboarding-feature"><div class="onboarding-feature-icon" aria-hidden="true">${escapeHTML(icon)}</div><div><h3>${escapeHTML(title)}</h3><p>${escapeHTML(copy)}</p></div></div>`;
    }

    function advanceOnboarding(event) {
      event.preventDefault();
      if (onboardingStep === 0) {
        saveOnboardingName();
        return;
      }
      if (onboardingStep < 3) {
        onboardingStep += 1;
        renderOnboardingStep();
        return;
      }
      completeOnboarding();
    }

    function goBackOnboarding() {
      if (onboardingStep <= 0) return;
      onboardingStep -= 1;
      renderOnboardingStep();
    }

    function saveOnboardingName() {
      const input = document.getElementById("profile-name-input");
      const error = document.getElementById("onboarding-error");
      const name = String(input && input.value || "").replace(/\s+/g, " ").trim();
      if (!name) {
        if (error) error.textContent = "Please enter your name.";
        if (input) input.focus();
        return;
      }
      if (name.length > 60) {
        if (error) error.textContent = "Your name must be 60 characters or fewer.";
        if (input) input.focus();
        return;
      }

      onboardingName = name;
      setOnboardingBusy(true, "Saving…");
      if (localPreviewMode) {
        currentUserProfile = { name: name, needsName: false, onboardingComplete: false, needsOnboarding: true };
        onboardingStep = 1;
        renderOnboardingStep();
        return;
      }

      apiRequest({ action: "saveProfile", name: name })
        .then(function(result) {
          if (result.type !== "profileSaved" || !result.profile) throw new Error(result.message || "Your name could not be saved.");
          currentUserProfile = result.profile;
          onboardingStep = 1;
          renderOnboardingStep();
        })
        .catch(function(saveError) {
          if (error) error.textContent = saveError.message || "Your name could not be saved. Please try again.";
          setOnboardingBusy(false, "Save and continue");
        });
    }

    function completeOnboarding() {
      const error = document.getElementById("onboarding-error");
      setOnboardingBusy(true, "Finishing…");
      if (localPreviewMode) {
        currentUserProfile = { name: onboardingName, needsName: false, onboardingComplete: true, needsOnboarding: false };
        finishOnboarding();
        return;
      }

      apiRequest({ action: "completeOnboarding" })
        .then(function(result) {
          if (result.type !== "onboardingComplete" || !result.profile) throw new Error(result.message || "Orientation could not be completed.");
          currentUserProfile = result.profile;
          finishOnboarding();
        })
        .catch(function(completeError) {
          if (error) error.textContent = completeError.message || "Orientation could not be completed. Please try again.";
          setOnboardingBusy(false, "Enter portal");
        });
    }

    function setOnboardingBusy(disabled, text) {
      const next = document.getElementById("onboarding-next");
      const back = document.getElementById("onboarding-back");
      if (next) { next.disabled = disabled; next.textContent = text; }
      if (back) back.disabled = disabled;
    }

    function finishOnboarding() {
      const modal = document.getElementById("onboarding-modal");
      if (modal) modal.hidden = true;
      initializeApp();
      navigateTo(currentPage === "team" && !currentIsExecutive ? "orders" : currentPage);
      showToast("Welcome, " + getFirstName() + ".");
    }

    function showInitialLoading() {
      const loginCard = document.querySelector(".login-card");
      if (!loginCard) return;
      loginCard.innerHTML = `<div class="brand-lockup"><div class="brand-mark" aria-hidden="true">SO</div><div><div class="brand-name">SciOly Orders</div><div class="brand-caption">Signing you in</div></div></div><div class="loading-state"><div class="spinner"></div>Loading your orders…</div>`;
    }

    function loadingState(text) {
      return `<div class="loading-state"><div class="spinner"></div>${escapeHTML(text)}</div>`;
    }

    function emptyState(icon, title, copy, showOrderButton) {
      return `<div class="empty-state"><div class="empty-icon" aria-hidden="true">${escapeHTML(icon)}</div><h3>${escapeHTML(title)}</h3><p>${escapeHTML(copy)}</p>${showOrderButton ? `<button class="button button-primary" style="margin-top:18px" type="button" onclick="openOrderingForm()">＋ Place new order</button>` : ""}</div>`;
    }

    function formatUpdatedTime() {
      if (!lastUpdatedAt) return "";
      return "Updated " + lastUpdatedAt.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function openOrderingForm() {
      window.open(ORDER_FORM_URL, "_blank", "noopener,noreferrer");
    }

    function returnToLogin() {
      if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();

      if (localPreviewMode) {
        window.location.href = window.location.href.split("?")[0].split("#")[0];
        return;
      }

      googleCredential = null;
      currentDashboardData = null;
      currentIsExecutive = false;
      currentIsSuperAdmin = false;
      currentMaintenanceMode = false;
      currentUserProfile = null;
      savedTeamStatistics = null;
      location.reload();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove("show"); }, 2600);
    }

    function showLoginError(error) {
      const errorDiv = document.getElementById("error-msg");
      errorDiv.textContent = error && error.message ? error.message : "Error connecting to the order database.";
      errorDiv.style.display = "block";
    }

    function hideLoginError() {
      const errorDiv = document.getElementById("error-msg");
      if (errorDiv) errorDiv.style.display = "none";
    }

    function safeHttpUrl(value) {
      const url = String(value || "").trim();
      return /^https?:\/\//i.test(url) ? url : "";
    }

    function money(value) {
      const number = Number(value || 0);
      return Number.isFinite(number) ? number.toFixed(2) : "0.00";
    }

    function capitalize(value) {
      const text = String(value || "").toLowerCase();
      return text ? text.charAt(0).toUpperCase() + text.slice(1) : "Low";
    }

    function escapeHTML(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) { return escapeHTML(value); }
  </script>
</body>
</html>
