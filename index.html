<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    SciOly Tracking Portal
  </title>


  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>


  <style>

    * {
      box-sizing:
        border-box;
    }


    :root {

      --bg:
        #f4f6f9;

      --card:
        #ffffff;

      --text:
        #202124;

      --muted:
        #5f6368;

      --border:
        #e0e0e0;

      --blue:
        #1a73e8;

      --green:
        #188038;

      --red:
        #c5221f;

      --yellow:
        #8a5a00;

      --shadow:
        0 3px 10px rgba(0,0,0,.045);

    }


    body {

      margin:
        0;

      padding:
        36px 18px;

      background:
        var(--bg);

      color:
        var(--text);

      font-family:
        "Segoe UI",
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

    }


    .main-wrapper {

      width:
        min(
          1100px,
          100%
        );

      margin:
        0 auto;

    }


    /* ======================================================
       NAVBAR
       ====================================================== */

    .navbar {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        14px;

      flex-wrap:
        wrap;

      padding:
        20px 26px;

      margin-bottom:
        28px;

      background:
        var(--card);

      border:
        1px solid #eceff1;

      border-radius:
        16px;

      box-shadow:
        var(--shadow);

    }


    .navbar h1 {

      margin:
        0;

      font-size:
        23px;

      font-weight:
        750;

      color:
        var(--blue);

    }


    .session-tag {

      padding:
        8px 13px;

      border-radius:
        999px;

      background:
        #e8f0fe;

      color:
        #1967d2;

      font-size:
        12px;

      font-weight:
        700;

    }


    /* ======================================================
       LOGIN
       ====================================================== */

    .login-box {

      width:
        min(
          420px,
          100%
        );

      margin:
        70px auto;

      padding:
        34px;

      background:
        var(--card);

      border-radius:
        18px;

      box-shadow:
        0 8px 28px rgba(0,0,0,.08);

      text-align:
        center;

    }


    .login-box h2 {

      margin:
        0 0 12px;

      font-size:
        22px;

    }


    .login-box p {

      margin:
        0 0 24px;

      color:
        var(--muted);

      line-height:
        1.5;

    }


    #error-msg {

      display:
        none;

      margin-top:
        16px;

      color:
        #d93025;

      font-size:
        13px;

      font-weight:
        650;

      line-height:
        1.45;

    }


    /* ======================================================
       MAIN GRID
       ====================================================== */

    .cards-grid {

      display:
        none;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(
            285px,
            1fr
          )
        );

      gap:
        18px;

    }


    .dashboard-buttons,
    .statistics-wide,
    .high-value-section {

      grid-column:
        1 / -1;

    }


    /* ======================================================
       BUTTONS
       ====================================================== */

    .dashboard-buttons {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        10px;

      flex-wrap:
        wrap;

    }


    .button-group {

      display:
        flex;

      gap:
        10px;

      flex-wrap:
        wrap;

    }


    .dashboard-button {

      border:
        0;

      border-radius:
        9px;

      padding:
        11px 17px;

      font-size:
        13px;

      font-weight:
        700;

      cursor:
        pointer;

      transition:
        transform .12s ease,
        opacity .12s ease;

    }


    .dashboard-button:hover {

      opacity:
        .92;

      transform:
        translateY(-1px);

    }


    .signout-button,
    .back-button,
    .refresh-button {

      background:
        #ffffff;

      border:
        1px solid #dadce0;

      color:
        var(--muted);

    }


    .refresh-button {

      background:
        #f8f9fa;

      color:
        var(--text);

    }


    .order-button {

      background:
        var(--blue);

      color:
        #ffffff;

    }


    .team-button {

      background:
        var(--green);

      color:
        #ffffff;

    }


    /* ======================================================
       COMMON CARDS
       ====================================================== */

    .item-card,
    .stat-card,
    .event-stat-card,
    .person-stat-card,
    .person-event-card,
    .person-item-card {

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        14px;

      box-shadow:
        var(--shadow);

    }


    /* ======================================================
       ORDER CARD
       ====================================================== */

    .item-card {

      min-height:
        250px;

      padding:
        22px;

      transition:
        transform .14s ease,
        box-shadow .14s ease;

    }


    .item-card:hover,
    .event-stat-card:hover,
    .person-stat-card:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 7px 20px rgba(0,0,0,.075);

    }


    .item-name {

      margin-bottom:
        9px;

      font-size:
        18px;

      font-weight:
        750;

    }


    .event-chip {

      display:
        inline-block;

      margin-bottom:
        12px;

      padding:
        5px 9px;

      border-radius:
        999px;

      background:
        #f1f3f4;

      color:
        var(--muted);

      font-size:
        11px;

      font-weight:
        700;

    }


    .metrics-block {

      color:
        var(--muted);

      font-size:
        13px;

      line-height:
        1.75;

    }


    .metrics-block b {

      color:
        var(--text);

    }


    /* ======================================================
       SIGNATURES
       ====================================================== */

    .signatures-label {

      margin-top:
        13px;

      color:
        var(--muted);

      font-size:
        12px;

    }


    .signatures-value {

      margin-top:
        3px;

      font-size:
        13px;

      font-weight:
        700;

    }


    /* ======================================================
       ORDER STATUS
       ====================================================== */

    .order-status-box {

      margin-top:
        15px;

      padding:
        9px 12px;

      border:
        1px solid transparent;

      border-radius:
        9px;

      text-align:
        center;

      font-size:
        12px;

      font-weight:
        750;

    }


    .status-pending,
    .status-default {

      background:
        #f1f3f4;

      color:
        var(--muted);

      border-color:
        #dadce0;

    }


    .status-processing {

      background:
        #e8f0fe;

      color:
        #1967d2;

      border-color:
        #c6dafc;

    }


    .status-shipped,
    .status-delivered {

      background:
        #e6f4ea;

      color:
        #137333;

      border-color:
        #b7dfc1;

    }


    .status-problem {

      background:
        #fce8e6;

      color:
        #c5221f;

      border-color:
        #f6aea9;

    }


    /* ======================================================
       DELIVERY ESTIMATE
       ====================================================== */

    .delivery-estimate {

      margin-top:
        12px;

      padding-top:
        12px;

      border-top:
        1px solid #eef0f2;

      color:
        var(--muted);

      font-size:
        13px;

      font-weight:
        650;

      line-height:
        1.5;

    }


    .delivery-delayed {

      color:
        var(--red);

      font-weight:
        750;

    }


    .delivery-confirmed {

      color:
        #137333;

      font-weight:
        750;

    }


    /* ======================================================
       CONFIDENCE
       ====================================================== */

    .estimate-info {

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      flex-wrap:
        wrap;

      margin-top:
        8px;

    }


    .estimate-confidence {

      display:
        inline-flex;

      align-items:
        center;

      padding:
        5px 9px;

      border:
        1px solid transparent;

      border-radius:
        999px;

      font-size:
        10.5px;

      font-weight:
        800;

      line-height:
        1;

    }


    .confidence-low {

      background:
        #fef7e0;

      color:
        #8a5a00;

      border-color:
        #f9e4a5;

    }


    .confidence-medium {

      background:
        #e8f0fe;

      color:
        #1967d2;

      border-color:
        #c6dafc;

    }


    .confidence-high,
    .confidence-actual {

      background:
        #e6f4ea;

      color:
        #137333;

      border-color:
        #b7dfc1;

    }


    .estimate-detail {

      width:
        100%;

      color:
        #80868b;

      font-size:
        10.5px;

      line-height:
        1.45;

    }


    /* ======================================================
       VENDOR LINK
       ====================================================== */

    .url-btn {

      display:
        inline-block;

      margin-top:
        13px;

      color:
        var(--blue);

      text-decoration:
        none;

      font-size:
        13px;

      font-weight:
        650;

    }


    .url-btn:hover {

      text-decoration:
        underline;

    }


    /* ======================================================
       EMPTY STATE
       ====================================================== */

    .empty-state {

      grid-column:
        1 / -1;

      padding:
        50px 24px;

      background:
        var(--card);

      border-radius:
        14px;

      color:
        var(--muted);

      text-align:
        center;

    }


    .empty-state h3 {

      margin-top:
        0;

      color:
        var(--text);

    }


    /* ======================================================
       STAT CARDS
       ====================================================== */

    .stat-card {

      padding:
        22px;

    }


    .stat-label {

      color:
        var(--muted);

      font-size:
        12px;

    }


    .stat-number {

      margin-top:
        5px;

      font-size:
        29px;

      font-weight:
        800;

    }


    .statistics-section-title {

      margin:
        10px 0 15px;

      font-size:
        19px;

      font-weight:
        750;

    }


    /* ======================================================
       HIGH-VALUE SECTION
       ====================================================== */

    .high-value-section {

      padding:
        22px;

      background:
        #fff4f3;

      border:
        1px solid #f3c2bd;

      border-radius:
        15px;

    }


    .high-value-title {

      color:
        #b3261e;

      font-size:
        19px;

      font-weight:
        800;

    }


    .high-value-subtitle {

      margin:
        4px 0 15px;

      color:
        #7a2d27;

      font-size:
        12px;

    }


    .high-value-list {

      display:
        flex;

      flex-direction:
        column;

      gap:
        10px;

    }


    .high-value-card {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        16px;

      flex-wrap:
        wrap;

      padding:
        15px 17px;

      background:
        #ffffff;

      border:
        1px solid #f0b6b0;

      border-left:
        5px solid #d93025;

      border-radius:
        10px;

    }


    .high-value-main {

      flex:
        1;

      min-width:
        220px;

    }


    .high-value-name {

      font-size:
        15px;

      font-weight:
        750;

    }


    .high-value-item {

      margin-top:
        3px;

      font-size:
        13px;

    }


    .high-value-meta {

      margin-top:
        5px;

      color:
        var(--muted);

      font-size:
        11px;

      line-height:
        1.5;

    }


    .high-value-price {

      color:
        #b3261e;

      font-size:
        23px;

      font-weight:
        800;

    }


    .high-value-badge {

      display:
        inline-block;

      margin-top:
        7px;

      padding:
        4px 8px;

      border-radius:
        999px;

      background:
        #fce8e6;

      color:
        #c5221f;

      font-size:
        10px;

      font-weight:
        800;

    }


    /* ======================================================
       EVENT + PEOPLE GRIDS
       ====================================================== */

    .event-stat-grid,
    .people-stat-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(
            245px,
            1fr
          )
        );

      gap:
        14px;

    }


    .event-stat-card,
    .person-stat-card {

      width:
        100%;

      padding:
        20px;

      text-align:
        left;

      cursor:
        pointer;

      transition:
        transform .14s ease,
        box-shadow .14s ease;

    }


    .event-stat-name,
    .person-stat-name {

      font-size:
        17px;

      font-weight:
        750;

    }


    .event-stat-label,
    .event-stat-orders,
    .person-stat-orders {

      margin-top:
        7px;

      color:
        var(--muted);

      font-size:
        12px;

    }


    .event-stat-price,
    .person-stat-total {

      margin-top:
        4px;

      font-size:
        26px;

      font-weight:
        800;

    }


    .event-stat-arrow {

      margin-top:
        15px;

      color:
        var(--blue);

      font-size:
        12px;

      font-weight:
        700;

    }


    /* ======================================================
       DETAIL PAGES
       ====================================================== */

    .event-detail-title,
    .person-detail-name {

      font-size:
        23px;

      font-weight:
        800;

    }


    .event-detail-total-label,
    .person-detail-subtitle {

      margin-top:
        7px;

      color:
        var(--muted);

      font-size:
        12px;

    }


    .event-detail-total,
    .person-detail-total {

      margin-top:
        4px;

      font-size:
        32px;

      font-weight:
        800;

    }


    .people-event-list {

      display:
        flex;

      flex-direction:
        column;

      gap:
        12px;

    }


    .person-event-card,
    .person-item-card {

      padding:
        17px;

    }


    .person-event-name,
    .person-item-name {

      font-size:
        14px;

      font-weight:
        750;

    }


    .person-event-total,
    .person-item-details {

      margin-top:
        5px;

      color:
        var(--muted);

      font-size:
        12px;

      line-height:
        1.55;

    }


    .event-items-list {

      margin-top:
        13px;

      border-top:
        1px solid #f1f3f4;

    }


    .event-item-row {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        15px;

      padding:
        11px 0;

      border-bottom:
        1px solid #f1f3f4;

    }


    .event-item-row:last-child {

      border-bottom:
        0;

    }


    .event-item-name {

      font-size:
        13px;

      font-weight:
        650;

    }


    .event-item-quantity {

      margin-top:
        2px;

      color:
        var(--muted);

      font-size:
        11px;

    }


    .event-item-price {

      font-size:
        13px;

      font-weight:
        750;

      white-space:
        nowrap;

    }


    .person-item-header {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        12px;

      align-items:
        center;

    }


    .person-item-price {

      font-size:
        14px;

      font-weight:
        800;

      white-space:
        nowrap;

    }


    .person-item-status {

      display:
        inline-block;

      margin-top:
        9px;

      padding:
        5px 8px;

      border-radius:
        999px;

      font-size:
        10px;

      font-weight:
        750;

    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (
      max-width: 620px
    ) {

      body {

        padding:
          18px 10px;

      }


      .navbar {

        padding:
          17px;

      }


      .login-box {

        margin-top:
          35px;

        padding:
          25px 18px;

      }


      .item-card {

        padding:
          19px;

      }


      .dashboard-button {

        padding:
          10px 13px;

      }


      .high-value-price {

        font-size:
          20px;

      }

    }

  </style>

</head>


<body>

  <div class="main-wrapper">


    <div class="navbar">

      <h1>
        SciOly Tracking Portal
      </h1>


      <div
        class="session-tag"
        id="user-session"
      >
        Session: Awaiting Login
      </div>

    </div>


    <div
      id="login-section"
      class="login-box"
    >

      <h2>
        Portal Sign In
      </h2>


      <p>
        Authenticate with your Google account
        to view tracking data.
      </p>


      <div
        id="g_id_onload"
        data-client_id="483790698157-mk3l3ugqgvh4uv10q3bng2g9j8j3vp8q.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
        data-auto_prompt="true"
        data-auto_select="true"
      >
      </div>


      <div
        class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-width="350"
      >
      </div>


      <div id="error-msg">
      </div>

    </div>


    <div
      id="portal-content"
      class="cards-grid"
    >
    </div>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzag2WkgUl-_WO4-xlbGJZ3n2sfVk6AFtvzGBCowHF4PxlS0U5Yq6h3IxMV_Xie-4g/exec";


    let googleCredential =
      null;


    let currentDashboardData =
      null;


    let currentIsExecutive =
      false;


    let savedTeamStatistics =
      null;


    /* ========================================================
       GOOGLE SIGN-IN
       ======================================================== */

    function handleCredentialResponse(
      response
    ) {

      const errorDiv =
        document.getElementById(
          "error-msg"
        );


      errorDiv.style.display =
        "none";


      googleCredential =
        response.credential;


      loadDashboard();

    }


    /* ========================================================
       API
       ======================================================== */

    function apiRequest(
      payload
    ) {

      if (
        !googleCredential
      ) {

        return Promise.reject(

          new Error(
            "Your Google login session is missing. Please sign in again."
          )

        );

      }


      return fetch(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              token:
                googleCredential,

              ...payload

            })

        }

      )

      .then(
        function(response) {

          return response.json();

        }
      );

    }


    /* ========================================================
       INITIAL DASHBOARD LOAD
       ======================================================== */

    function loadDashboard() {

      apiRequest({})

      .then(
        function(data) {

          if (
            data.type ===
            "exec"
          ) {

            renderDashboard(
              data.data,
              true
            );

            return;

          }


          if (
            data.type ===
            "student"
          ) {

            renderDashboard(
              data.data,
              false
            );

            return;

          }


          throw new Error(

            data.message ||
            "Login failed."

          );

        }
      )

      .catch(
        showLoginError
      );

    }


    function showLoginError(
      error
    ) {

      console.error(
        error
      );


      const errorDiv =
        document.getElementById(
          "error-msg"
        );


      errorDiv.textContent =

        error &&
        error.message

          ? error.message

          : "Error connecting to the backend database.";


      errorDiv.style.display =
        "block";

    }


    /* ========================================================
       PERSONAL DASHBOARD
       ======================================================== */

    function renderDashboard(
      data,
      isExecutive
    ) {

      currentDashboardData =
        data;


      currentIsExecutive =
        isExecutive;


      document.getElementById(
        "user-session"
      ).textContent =

        (
          isExecutive

            ? "Executive Portal: "

            : "Portal User: "
        ) +

        (
          data.email ||
          ""
        );


      document.getElementById(
        "login-section"
      ).style.display =
        "none";


      const container =
        document.getElementById(
          "portal-content"
        );


      container.style.display =
        "grid";


      let html = `

        <div class="dashboard-buttons">

          <div class="button-group">

            <button
              class="
                dashboard-button
                signout-button
              "
              onclick="returnToLogin()"
            >
              ← Sign Out
            </button>


            <button
              class="
                dashboard-button
                refresh-button
              "
              onclick="refreshDashboard()"
            >
              ↻ Refresh Data
            </button>


            <button
              class="
                dashboard-button
                order-button
              "
              onclick="openOrderingForm()"
            >
              + Place New Order
            </button>


            ${
              isExecutive

                ? `

                  <button
                    class="
                      dashboard-button
                      team-button
                    "
                    onclick="showTeamStatistics()"
                  >
                    Team Statistics
                  </button>

                `

                : ""
            }

          </div>

        </div>

      `;


      const items =

        Array.isArray(
          data.items
        )

          ? data.items

          : [];


      if (
        items.length ===
        0
      ) {

        html += `

          <div class="empty-state">

            <h3>
              No Entries Found
            </h3>

            <p>
              There are no active orders
              linked to this account.
            </p>

          </div>

        `;


        container.innerHTML =
          html;


        return;

      }


      html +=

        items

          .map(
            renderOrderCard
          )

          .join(
            ""
          );


      container.innerHTML =
        html;

    }


    /* ========================================================
       ORDER TILE
       ======================================================== */

    function renderOrderCard(
      item
    ) {

      const statusClass =
        getStatusClass(
          item.orderStatus
        );


      const estimateClass =

        item.isStuck

          ? "delivery-estimate delivery-delayed"

          : item.isDelivered

            ? "delivery-estimate delivery-confirmed"

            : "delivery-estimate";


      const stage =

        String(
          item.stage ||
          ""
        )

        .toUpperCase();


      const isActual =

        item.isDelivered ||

        stage ===
          "DELIVERED" ||

        stage ===
          "CANCELLED" ||

        String(
          item.estimateConfidence ||
          ""
        )
        .toLowerCase() ===
          "actual";


      const confidence =

        isActual

          ? "actual"

          : String(
              item.estimateConfidence ||
              "low"
            )
            .toLowerCase();


      const confidenceClass =

        confidence ===
          "actual"

          ? "confidence-actual"

          : confidence ===
              "high"

            ? "confidence-high"

            : confidence ===
                "medium"

              ? "confidence-medium"

              : "confidence-low";


      const confidenceLabel =

        isActual

          ? "Actual"

          : item.estimateConfidenceLabel ||

            (
              confidence ===
                "high"

                ? "High"

                : confidence ===
                    "medium"

                  ? "Medium"

                  : "Low"
            );


      const confidenceDetail =

        item.estimateConfidenceDetail ||

        getFallbackConfidenceDetail(
          item,
          confidence,
          isActual
        );


      const qtyNumber =

        Number(

          item.numericQuantity ||

          item.qty ||

          1

        );


      const unitPrice =
        Number(
          item.unitPrice
        );


      const showUnitPrice =

        Number.isFinite(
          unitPrice
        ) &&

        qtyNumber >
          1;


      return `

        <div class="item-card">


          <div class="item-name">

            ${escapeHTML(
              item.itemName
            )}

          </div>


          ${
            item.eventName

              ? `

                <div class="event-chip">

                  ${escapeHTML(
                    item.eventName
                  )}

                </div>

              `

              : ""
          }


          <div class="metrics-block">

            Quantity:

            <b>

              ${escapeHTML(
                item.qty
              )}

            </b>


            ${
              showUnitPrice

                ? `

                  <br>

                  Unit Price:

                  <b>

                    $${unitPrice.toFixed(
                      2
                    )}

                  </b>

                `

                : ""
            }


            <br>

            Total Cost:

            <b>

              ${escapeHTML(
                item.price
              )}

            </b>

          </div>


          <div class="signatures-label">

            Signatures:

          </div>


          <div class="signatures-value">

            ${escapeHTML(
              item.signatures
            )}

          </div>


          <div
            class="
              order-status-box
              ${statusClass}
            "
          >

            ${escapeHTML(
              item.orderStatus
            )}

          </div>


          <div class="${estimateClass}">

            ${escapeHTML(
              item.deliveryText
            )}

          </div>


          <div class="estimate-info">


            <div
              class="
                estimate-confidence
                ${confidenceClass}
              "
            >

              ${
                isActual

                  ? "✓ Actual status"

                  : "Estimate confidence: " +
                    escapeHTML(
                      confidenceLabel
                    )
              }

            </div>


            <div class="estimate-detail">

              ${escapeHTML(
                confidenceDetail
              )}

            </div>

          </div>


          ${
            item.link &&
            String(
              item.link
            )
            .startsWith(
              "http"
            )

              ? `

                <a
                  class="url-btn"
                  href="${escapeAttribute(
                    item.link
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Open Vendor Link ↗
                </a>

              `

              : ""
          }

        </div>

      `;

    }


    /* ========================================================
       FALLBACK CONFIDENCE TEXT
       ======================================================== */

    function getFallbackConfidenceDetail(
      item,
      confidence,
      isActual
    ) {

      if (
        isActual
      ) {

        if (
          String(
            item.stage ||
            ""
          )
          .toUpperCase() ===
          "CANCELLED"
        ) {

          return (
            "Cancellation confirmed by the current order status."
          );

        }


        return (
          "Delivery confirmed by the current order status."
        );

      }


      const stage =

        String(
          item.stage ||
          ""
        )
        .toUpperCase();


      if (
        confidence ===
        "high"
      ) {

        return (
          "Based on a stronger amount of historical timing data."
        );

      }


      if (
        confidence ===
        "medium"
      ) {

        return (
          "Based on a limited but useful amount of historical timing data."
        );

      }


      if (

        stage ===
          "ORDERED" &&

        String(
          item.vendor ||
          ""
        )
        .toUpperCase() ===
          "AMAZON"

      ) {

        return (
          "Low confidence: the estimate may still rely on the default Amazon delivery timing."
        );

      }


      if (

        stage ===
          "ORDERED" ||

        stage ===
          "SHIPPED"

      ) {

        return (
          "Low confidence: more completed delivery history is needed."
        );

      }


      return (
        "Low confidence: the estimator is still learning from approval history."
      );

    }

          </p>

      apiRequest({})

      .then(

            null;


          if (
            data.type ===
            "exec"
          ) {

            renderDashboard(
              data.data,
              true
            );

            return;

          if (
            data.type ===

          ) {

            );

          }


          throw new Error(

    /* ========================================================
       STATUS CLASS
       ======================================================== */

    function getStatusClass(
      status
    ) {

      const normalized =

        String(
          status ||
          ""
        )

        .toLowerCase()

        .trim();


      if (
        normalized.includes(
          "delivered"
        )
      ) {

        return (
          "status-delivered"
        );

      }


      if (

        normalized.includes(
          "shipped"
        ) ||

        normalized.includes(
          "in transit"
        )

      ) {

        return (
          "status-shipped"
        );

      }


      if (

        normalized.includes(
          "delay"
        ) ||

        normalized.includes(
          "problem"
        ) ||

        normalized.includes(
          "error"
        ) ||

        normalized.includes(
          "cancel"
        )

      ) {

        return (
          "status-problem"
        );

      }


      if (

        normalized.includes(
          "process"
        ) ||

        normalized.includes(
          "ordered"
        ) ||

        normalized.includes(
          "purchased"
        ) ||

        normalized.includes(
          "step"
        )

      ) {

        return (
          "status-processing"
        );

      }


      if (

        normalized ===
          "" ||

        normalized.includes(
          "pending"
        )

      ) {

        return (
          "status-pending"
        );

      }


      return (
        "status-default"
      );

    }


    /* ========================================================
       MONEY
       ======================================================== */

    function money(
      value
    ) {

      const number =
        Number(
          value ||
          0
        );


      return Number.isFinite(
        number
      )

        ? number.toFixed(
            2
          )

        : "0.00";

    }


    /* ========================================================
       HTML ESCAPING
       ======================================================== */

    function escapeHTML(
      value
    ) {

      if (

        value === null ||

        value === undefined

      ) {

        return "";

      }


      return String(
        value
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }


    function escapeAttribute(
      value
    ) {

      return escapeHTML(
        value
      );
