<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciOly Tracking Portal</title>
    <!-- Load Google's official Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        padding: 40px 20px;
        margin: 0;
        background-color: #f4f6f9;
        color: #202124;
      }

      .main-wrapper {
        max-width: 1000px;
        margin: 0 auto;
      }

      .navbar {
        background-color: #ffffff;
        padding: 20px 30px;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        margin-bottom: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
      }

      h1 {
        margin: 0;
        color: #1a73e8;
        font-size: 24px;
        font-weight: 600;
      }

      .session-tag {
        background-color: #e8f0fe;
        color: #1a73e8;
        padding: 9px 16px;
        border-radius: 30px;
        font-weight: 500;
        font-size: 13px;
      }

      .login-box {
        max-width: 420px;
        margin: 60px auto;
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        text-align: center;
      }

      .login-box h3 {
        margin-top: 0;
        font-size: 20px;
        color: #202124;
      }

      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }

      .item-card {
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 24px;
        background-color: #ffffff;
        box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 190px;
      }

      .item-name {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #202124;
      }

      .metrics-block {
        font-size: 14px;
        color: #5f6368;
        margin-bottom: 12px;
        line-height: 1.6;
      }

      .metrics-block b {
        color: #202124;
      }

      .url-btn {
        display: inline-block;
        margin-top: 6px;
        color: #1a73e8;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
      }

      .url-btn:hover {
        text-decoration: underline;
      }

      .empty-state {
        text-align: center;
        color: #5f6368;
        padding: 60px;
        background: white;
        border-radius: 12px;
        grid-column: 1 / -1;
      }

      #error-msg {
        color: #d93025;
        font-size: 14px;
        margin-top: 15px;
        font-weight: 500;
        display: none;
      }

      /* ADVISOR MODE */
      .advisor-card {
        grid-column: 1 / -1;
        background: #ffffff;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      }

      .advisor-header {
        margin-bottom: 28px;
      }

      .advisor-header h2 {
        margin: 0 0 8px 0;
        color: #202124;
      }

      .advisor-header p {
        margin: 0;
        color: #5f6368;
      }

      .form-group {
        margin-bottom: 22px;
      }

      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #202124;
      }

      .form-group input[type="number"],
      .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 12px;
        font-family: inherit;
        font-size: 15px;
      }

      .form-group textarea {
        min-height: 120px;
        resize: vertical;
      }

      .file-drop-area {
        border: 2px dashed #dadce0;
        border-radius: 12px;
        padding: 30px;
        text-align: center;
        background-color: #fafafa;
        cursor: pointer;
      }

      .file-drop-area input {
        display: none;
      }

      .file-drop-title {
        font-size: 16px;
        font-weight: 600;
        color: #202124;
        margin-bottom: 6px;
      }

      .file-drop-subtitle {
        font-size: 13px;
        color: #5f6368;
      }

      .file-list {
        margin-top: 15px;
        text-align: left;
      }

      .file-item {
        background: #f1f3f4;
        padding: 9px 12px;
        border-radius: 6px;
        margin-bottom: 6px;
        font-size: 13px;
        color: #3c4043;
      }

      .upload-btn {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 14px 20px;
        background-color: #1a73e8;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      .upload-btn:hover {
        background-color: #1769d1;
      }

      .upload-status {
        margin-top: 18px;
        padding: 13px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
      }

      .upload-status.success { display: block; background-color: #e6f4ea; color: #137333; }
      .upload-status.error { display: block; background-color: #fce8e6; color: #c5221f; }
      .upload-status.loading { display: block; background-color: #e8f0fe; color: #174ea6; }

      .advisor-info {
        margin-top: 25px;
        padding: 15px;
        background-color: #f8f9fa;
        border-radius: 8px;
        font-size: 13px;
        color: #5f6368;
        line-height: 1.5;
      }

      .logout-btn {
        margin-top: 15px;
        background: transparent;
        border: none;
        color: #5f6368;
        cursor: pointer;
        font-size: 13px;
      }

      .logout-btn:hover { color: #1a73e8; }
    </style>
  </head>

  <body>

    <div class="main-wrapper">
      <!-- NAVBAR -->
      <div class="navbar">
        <h1>SciOly Tracking Portal</h1>
        <div class="session-tag" id="user-session">Session: Awaiting Login</div>
      </div>

      <!-- GOOGLE LOGIN SECTION -->
      <div id="login-section" class="login-box">
        <h3>Portal Sign In</h3>
        <p style="color: #5f6368; font-size: 14px; margin-bottom: 20px;">
          Authenticate with your Google account to view tracking data.
        </p>

        <!-- Google Identity Services Button Container -->
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-width="100%"></div>

        <div id="error-msg"></div>
      </div>

      <!-- PORTAL CONTENT -->
      <div id="portal-content" class="cards-grid" style="display: none;"></div>
    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbzag2WkgUl-_WO4-xlbGJZ3n2sfVk6AFtvzGBCowHF4PxlS0U5Yq6h3IxMV_Xie-4g/exec";

      // Triggered automatically when user clicks Google Sign-In and authenticates
      async function handleCredentialResponse(response) {
        const errorDiv = document.getElementById('error-msg');
        errorDiv.style.display = "none";

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ token: response.credential })
          });

          const data = await res.json();

          if (data.type === "advisor") {
            showAdvisorMode(data.email);
          } else if (data.type === "student") {
            renderDashboard(data.data);
          } else {
            errorDiv.innerText = data.message || "Login failed.";
            errorDiv.style.display = "block";
          }
        } catch (error) {
          console.error(error);
          errorDiv.innerText = "Error connecting to the backend database.";
          errorDiv.style.display = "block";
        }
      }

      function showAdvisorMode(email) {
        document.getElementById('user-session').innerText = "Advisor Mode Active (" + email + ")";
        document.getElementById('login-section').style.display = 'none';

        const container = document.getElementById('portal-content');
        container.style.display = 'grid';
        container.innerHTML = `
          <div class="advisor-card">
            <div class="advisor-header">
              <h2>Advisor Package Receiving</h2>
              <p>Record packages that have arrived for Science Olympiad.</p>
            </div>
            <div class="form-group">
              <label for="package-count">Number of Packages Arrived</label>
              <input type="number" id="package-count" min="1" value="1" />
            </div>
            <div class="form-group">
              <label>Package Photos</label>
              <label class="file-drop-area" for="package-files">
                <div class="file-drop-title">Click to select package photos</div>
                <input type="file" id="package-files" accept="image/*" multiple onchange="updateFileList()" />
              </label>
              <div id="file-list" class="file-list"></div>
            </div>
            <div class="form-group">
              <label for="package-notes">Notes</label>
              <textarea id="package-notes" placeholder="Notes on package arrival..."></textarea>
            </div>
            <button id="upload-btn" class="upload-btn" onclick="uploadPackages()">Upload Package Arrival</button>
            <div id="upload-status" class="upload-status"></div>
            <button class="logout-btn" onclick="returnToLogin()">← Sign Out</button>
          </div>
        `;
      }

      function updateFileList() {
        const input = document.getElementById('package-files');
        const fileList = document.getElementById('file-list');
        if (!input || !fileList) return;
        fileList.innerHTML = "";
        for (let i = 0; i < input.files.length; i++) {
          const fileItem = document.createElement('div');
          fileItem.className = "file-item";
          fileItem.innerText = "📷 " + input.files[i].name;
          fileList.appendChild(fileItem);
        }
      }

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.onerror = () => reject(new Error("Could not read file"));
          reader.readAsDataURL(file);
        });
      }

      async function uploadPackages() {
        const packageCountInput = document.getElementById('package-count');
        const filesInput = document.getElementById('package-files');
        const notesInput = document.getElementById('package-notes');
        const uploadButton = document.getElementById('upload-btn');
        
        const packageCount = packageCountInput.value;
        const notes = notesInput.value.trim();
        const files = filesInput.files;

        if (!packageCount || Number(packageCount) < 1) {
          showUploadStatus("Enter number of packages.", "error");
          return;
        }
        if (files.length === 0) {
          showUploadStatus("Select at least one photo.", "error");
          return;
        }

        uploadButton.disabled = true;
        uploadButton.innerText = "Uploading...";
        showUploadStatus("Processing photos...", "loading");

        try {
          const encodedFiles = [];
          for (let i = 0; i < files.length; i++) {
            const base64 = await fileToBase64(files[i]);
            encodedFiles.push({ name: files[i].name, mimeType: files[i].type, data: base64 });
          }

          const payload = { files: encodedFiles, notes: notes, packageCount: Number(packageCount) };
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (result.status === "success") {
            showUploadStatus("Uploaded successfully!", "success");
            packageCountInput.value = 1;
            filesInput.value = "";
            notesInput.value = "";
            document.getElementById('file-list').innerHTML = "";
          } else {
            throw new Error(result.message || "Upload failed.");
          }
        } catch (error) {
          showUploadStatus("Upload failed: " + error.message, "error");
        } finally {
          uploadButton.disabled = false;
          uploadButton.innerText = "Upload Package Arrival";
        }
      }

      function showUploadStatus(message, type) {
        const statusDiv = document.getElementById('upload-status');
        statusDiv.innerText = message;
        statusDiv.className = "upload-status " + type;
      }

      function returnToLogin() {
        location.reload(); // Reloads page to reset session state clean
      }

      function renderDashboard(data) {
        document.getElementById('user-session').innerText = "Portal User: " + data.email;
        document.getElementById('login-section').style.display = 'none';
        
        const container = document.getElementById('portal-content');
        container.style.display = 'grid';

        let dashboardHTML = `
          <div style="grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
            <button onclick="returnToLogin()" style="background: white; border: 1px solid #dadce0; color: #5f6368; padding: 11px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">
              ← Sign Out
            </button>
            <button onclick="openOrderingForm()" style="background: #1a73e8; border: none; color: white; padding: 11px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">
              + Place New Order
            </button>
          </div>
        `;

        if (!data.items || data.items.length === 0) {
          dashboardHTML += `
            <div class="empty-state">
              <h3>No Entries Found</h3>
              <p>There are no active orders linked to this account.</p>
            </div>
          `;
          container.innerHTML = dashboardHTML;
          return;
        }

        dashboardHTML += data.items.map(item => `
          <div class="item-card">
            <div>
              <div class="item-name">${item.itemName}</div>
              <div class="metrics-block">
                Quantity: <b>${item.qty}</b><br>
                Total Cost: <b>${item.price}</b><br>
                Status: <b>${item.status}</b>
              </div>
              ${item.link && item.link.startsWith('http') ? `<a class="url-btn" href="${item.link}" target="_blank">Open Vendor Link ↗</a>` : ''}
            </div>
          </div>
        `).join('');

        container.innerHTML = dashboardHTML;
      }

      function openOrderingForm() {
        window.open("https://forms.gle/e2qgGCRH5vSSTHmF7", "_blank");
      }
    </script>
  </body>
</html>
