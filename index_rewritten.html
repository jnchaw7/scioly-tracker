<body>

  <div class="main-wrapper">


    <!-- ====================================================
         NAVBAR
         ==================================================== -->

    <div class="navbar">

      <h1>
        SciOly Tracking Portal
      </h1>


      <div
        class="session-tag"
        id="user-session"
      >
        Session: Awaiting Login
      </div>

    </div>


    <!-- ====================================================
         LOGIN
         ==================================================== -->

    <div
      id="login-section"
      class="login-box"
    >

      <h3>
        Portal Sign In
      </h3>


      <p
        style="
          color: #5f6368;
          font-size: 14px;
          margin-bottom: 20px;
        "
      >
        Authenticate with your Google account
        to view tracking data.
      </p>


      <div
        id="g_id_onload"
        data-client_id="483790698157-mk3l3ugqgvh4uv10q3bng2g9j8j3vp8q.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
        data-auto_prompt="true"
        data-auto_select="true"
      >
      </div>


      <div
        class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-width="350"
      >
      </div>


      <div id="error-msg"></div>

    </div>


    <!-- ====================================================
         PORTAL
         ==================================================== -->

    <div
      id="portal-content"
      class="cards-grid"
      style="display: none;"
    >
    </div>


  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzag2WkgUl-_WO4-xlbGJZ3n2sfVk6AFtvzGBCowHF4PxlS0U5Yq6h3IxMV_Xie-4g/exec";


    let googleCredential =
      null;


    let currentDashboardData =
      null;


    let currentIsExecutive =
      false;


    let savedTeamStatistics =
      null;


    /*
     * ========================================================
     * GOOGLE LOGIN
     * ========================================================
     */

    function handleCredentialResponse(
      response
    ) {

      const errorDiv =
        document.getElementById(
          "error-msg"
        );


      errorDiv.style.display =
        "none";


      googleCredential =
        response.credential;


      fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              token:
                response.credential

            })

        }
      )

      .then(
        function(response) {

          return response.json();

        }
      )

      .then(
        function(data) {


          if (
            data.type ===
            "exec"
          ) {

            renderDashboard(
              data.data,
              true
            );

            return;

          }


          if (
            data.type ===
            "student"
          ) {

            renderDashboard(
              data.data,
              false
            );

            return;

          }


          errorDiv.innerText =
            data.message ||
            "Login failed.";


          errorDiv.style.display =
            "block";

        }
      )

      .catch(
        function(error) {

          console.error(
            error
          );


          errorDiv.innerText =
            "Error connecting to the backend database.";


          errorDiv.style.display =
            "block";

        }
      );

    }


    /*
     * ========================================================
     * PERSONAL DASHBOARD
     * ========================================================
     */

    function renderDashboard(
      data,
      isExecutive
    ) {

      currentDashboardData =
        data;


      currentIsExecutive =
        isExecutive;


      document.getElementById(
        "user-session"
      ).innerText =
        isExecutive
          ? "Executive Portal: " +
            data.email
          : "Portal User: " +
            data.email;


      document.getElementById(
        "login-section"
      ).style.display =
        "none";


      const container =
        document.getElementById(
          "portal-content"
        );


      container.style.display =
        "grid";


      let html = `

        <div
          class="dashboard-buttons"
        >

          <div
            class="button-group"
          >

            <button
              class="
                dashboard-button
                signout-button
              "
              onclick="returnToLogin()"
            >
              ← Sign Out
            </button>

            <button
              class="
                dashboard-button
                refresh-button
              "
              onclick="refreshDashboard()"
            >
              ↻ Refresh Data
            </button>

            <button
              class="
                dashboard-button
                order-button
              "
              onclick="openOrderingForm()"
            >
              + Place New Order
            </button>


            ${
              isExecutive
                ? `

                  <button
                    class="
                      dashboard-button
                      team-button
                    "
                    onclick="showTeamStatistics()"
                  >
                    Team Statistics

    /*
     * ========================================================
     * STATUS STYLE
     * ========================================================
     */

    function getStatusClass(
      status
    ) {

      var normalized =
        String(
          status || ""
        )
        .toLowerCase()
        .trim();


      if (
        normalized.includes(
          "delivered"
        )
      ) {

        return "status-delivered";

      }


      if (
        normalized.includes(
          "shipped"
        )
      ) {

        return "status-shipped";

      }


      if (
        normalized.includes(
          "delay"
        ) ||
        normalized.includes(
          "problem"
        ) ||
        normalized.includes(
          "error"
        )
      ) {

        return "status-problem";

      }


      if (
        normalized.includes(
          "process"
        ) ||
        normalized.includes(
          "ordered"
        ) ||
        normalized.includes(
          "step"
        )
      ) {

        return "status-processing";

      }


      if (
        normalized === "" ||
        normalized.includes(
          "pending"
        )
      ) {

        return "status-pending";

      }


      return "status-default";

    }

          },

    /*
     * ========================================================
     * HTML ESCAPING
     * ========================================================
     */

    function escapeHTML(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(
      value
    ) {

      return escapeHTML(
        value
      );

    }

  </script>
